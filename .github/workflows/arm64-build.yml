name: ARM64 kernel module packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arm64-build.yml'
      - 'scripts/arm64/**'
      - 'src/**'
      - 'Makefile'
      - 'harness/fixtures/mt7603u_e2.bin'
permissions:
  contents: read
concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'loverto/mt7603u'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: openeuler2203-5.10
            image: openeuler/openeuler:22.03-lts-sp4@sha256:55cd2516f822e6c6e6d58d8c6978379c01620e7ed206bafe04ecd2ddab52afd2
            headers: kernel-devel-5.10.0-216.0.0.115.oe2203sp4.aarch64
            pattern: '5.10.*'
            prefix: '5.10.'
          - label: ubuntu24-6.8
            image: ubuntu:24.04
            headers: linux-headers-generic
            pattern: 'linux-headers-*-generic'
            prefix: '6.8.'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build in matching ARM64 distribution userspace
        env:
          IMAGE: ${{ matrix.image }}
          HEADERS: ${{ matrix.headers }}
          HEADER_PATTERN: ${{ matrix.pattern }}
          KERNEL_PREFIX: ${{ matrix.prefix }}
          BUILD_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e HEADERS -e HEADER_PATTERN -e KERNEL_PREFIX -e BUILD_LABEL \
            -e SOURCE_COMMIT="$GITHUB_SHA" \
            "$IMAGE" bash scripts/arm64/ci-build.sh
      - name: Upload candidate package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mt7603u-${{ matrix.label }}-arm64
          path: dist/*.tar.gz*
          if-no-files-found: error
  publish:
    if: ${{ !cancelled() && github.repository == 'loverto/mt7603u' && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mt7603u-*
          merge-multiple: true
          path: dist
      - name: Publish build-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(*.tar.gz)
          checksums=(*.tar.gz.sha256)
          count=${#archives[@]}
          [[ "$count" -ge 1 && "$count" -le 2 && "$count" -eq "${#checksums[@]}" ]] || { echo "No valid package/checksum pairs, or unexpected package count"; exit 1; }
          for archive in "${archives[@]}"; do
            test -s "$archive.sha256"
            sha256sum -c "$archive.sha256"
          done
          state=partial
          if [[ "$BUILD_RESULT" = success ]]; then
            [[ "$count" -eq 2 ]] || { echo "Both builds succeeded but packages are missing"; exit 1; }
            state=complete
          fi
          printf '%s\n' "Build matrix result: $BUILD_RESULT ($count/2 packages)." > release-notes.txt
          printf '%s\n' "Only the following successfully compiled candidate packages are included:" >> release-notes.txt
          printf -- '- %s\n' "${archives[@]}" >> release-notes.txt
          printf '%s\n' "These are build-only candidates for their exact kernel releases; no Kylin or hardware validation. Vendor firmware is not redistributed; see README. Source commit: $GITHUB_SHA." >> release-notes.txt
          tag="arm64-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "${archives[@]}" "${checksums[@]}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "ARM64 kernel-module candidates ($state, $count/2; $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT)" \
            --notes-file release-notes.txt
